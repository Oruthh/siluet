<article class="product-card">
    <h3>{{ item.name | uppercase }}</h3>
    <span class="price">{{ item.price }}</span>
    @if(item.inStock) {
        <button>{{ "product.addToCart" | t }}</button>
    } @else {
        <span class="out-of-stock">{{ "product.outOfStock" | t }}</span>
    }
</article>
